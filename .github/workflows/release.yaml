name: Validate & Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  publish-npm:
    runs-on: ubuntu-latest
    needs: validate
    # npm trusted publishing: npm exchanges this job's OIDC token for a short-lived publish
    # credential, so no npm token is stored. The publisher (autotelic/openapi-test-coverage,
    # release.yaml) is configured on the package's npmjs.com settings page.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: npm publish --access public
